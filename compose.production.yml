x-api-image: &api-image
  image: indieforge-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    command: pnpm --filter @indieforge/database prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      WEB_ORIGIN: ${SITE_ORIGIN:?set SITE_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GAME_STORAGE_ROOT: /var/lib/indieforge/games
      GAME_UPLOAD_MAX_BYTES: "26214400"
    volumes:
      - game_storage:/var/lib/indieforge/games
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3001/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: indieforge-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEPLOY_ADDRESS: ${DEPLOY_ADDRESS:?set DEPLOY_ADDRESS}
    ports:
      - ${HTTP_PORT:-80}:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  game_storage:
  caddy_data:
  caddy_config:
